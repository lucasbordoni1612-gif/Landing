[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credits-agent"
version = "0.1.0"
description = "Agente que descobre programas oficiais de créditos para startups, prepara inscrições com aprovação humana e controla os créditos recebidos."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
credits-agent = "credits_agent.cli:main"

[tool.setuptools.packages.find]
include = ["credits_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
